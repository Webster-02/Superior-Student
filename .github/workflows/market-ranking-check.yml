permissions:
  contents: read

jobs:
  verify:
    name: Verify Market data and APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'
      - name: Validate embedded JavaScript
        run: find app/src/main/assets/js -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Verify Market reference routes
        run: python3 scripts/verify_market_reference_routes.py
      - name: Clean project
        run: gradle clean --no-daemon
      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: superior-student-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
