name: Export Production Firestore Indexes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-production-indexes:
    name: Read current production indexes (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed deployment files
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PACHATTARPERCENT }}

      - name: Export currently deployed indexes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npx --yes firebase-tools@latest firestore:indexes --project pachattarpercent > artifacts/production-indexes-live.json
          jq -e '(.indexes | type == "array") and ((.fieldOverrides // []) | type == "array")' artifacts/production-indexes-live.json >/dev/null
          echo "Export validated. This workflow only reads indexes; it does not deploy or change them."

      - name: Upload index export
        uses: actions/upload-artifact@v4
        with:
          name: production-firestore-indexes-${{ github.run_number }}
          path: artifacts/production-indexes-live.json
          if-no-files-found: error
          retention-days: 7
